<label for="code">{{ I18N.Tenant.edit.code }}</label>
@if (isCreate) {
  <input nz-input
    [(ngModel)]="code"
    name="code"
    placeholder="">
}
<label for="name">{{ I18N.Tenant.edit.name }}</label>
<input nz-input
  [(ngModel)]="name"
  name="name"
  placeholder="">
  <button nz-button
    nzType="primary"
    nzSize="small"
    (click)="submit()"
  nzSearch>{{ I18N.Common.action.confirm }}</button>
