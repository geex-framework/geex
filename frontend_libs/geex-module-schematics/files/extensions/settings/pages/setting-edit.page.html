  [tab]="phTab"
  [extra]="phExtra"
  [action]="phActionTpl">
  <ng-template #phContentTpl>
    {{ I18N.Settings.editTitle }}
  </ng-template>
  <ng-template #phExtra>

    nzType="primary">
    <i nz-icon
    nzType="edit"></i>
  编辑</button> -->
</ng-template>

  <nz-tab nzTitle="Tab 3"></nz-tab>
</nz-tabs> -->

  nzType="primary">
  <i nz-icon
  nzType="audit"></i>
  审批
</button> -->

<nz-card>

        [formData]="entity"
        [ui]="ui"
      (formSubmit)="submit($event)"></sf>
    }
  </nz-spin>
</nz-card>
}
