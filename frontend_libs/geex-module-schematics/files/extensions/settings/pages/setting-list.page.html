@defer (when params()) {
<list-page-layout [title]="I18N.Settings.listTitle"
                  [loading]="loading()"
                  [total]="total()"
                  [data]="data()"
                  [pi]="params().pi"
                  [ps]="params().ps"
                  [selectedCount]="selectedData().length"
                  [columns]="columns"
                  (refresh)="refresh()"
                  (tableChange)="tableChange($event)">
  @if (paramsForm) {
    <form filters
          nz-form
          [formGroup]="paramsForm"
          nzLayout="inline">
      <nz-form-item>
        <nz-form-label>{{ I18N.Common.list.name }}</nz-form-label>
        <nz-form-control>
          <input nz-input
                 [formControl]="paramsForm.controls.name" />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <button (click)="refresh()"
                nz-button
                nzType="primary">
          <i nz-icon
             nzType="search"
             nzTheme="outline"></i>{{ I18N.Common.action.search }}
        </button>
      </nz-form-item>
    </form>
  }
</list-page-layout>
}
