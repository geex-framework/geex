<list-page-layout [title]="I18N.ApprovalFlows.listTitle || I18N.ApprovalFlows.title"
                  [loading]="loading()"
                  [total]="total()"
                  [data]="data()"
                  [pi]="pageIndex"
                  [ps]="pageSize"
                  [columns]="columns"
                  [multiSort]="false"
                  (refresh)="load()"
                  (tableChange)="onTableChange($event)">
  <form filters
        nz-form
        nzLayout="inline">
    <nz-form-item>
      <nz-form-label>{{ I18N.ApprovalFlows.name }}</nz-form-label>
      <nz-form-control>
        <input nz-input
               [(ngModel)]="filterText"
               name="filterText"
               [placeholder]="I18N.ApprovalFlows.name"
               (keyup.enter)="load()" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <button nz-button
              nzType="primary"
              type="button"
              (click)="load()">
        <i nz-icon
           nzType="search"
           nzTheme="outline"></i>{{ I18N.Common.action.search }}
      </button>
    </nz-form-item>
  </form>
  <ng-template #headerExtra>
    <button nz-button
            nzType="primary"
            type="button"
            (click)="add()">
      <i nz-icon
         nzType="plus"></i>
      {{ I18N.Common.action.create }}
    </button>
  </ng-template>
</list-page-layout>
