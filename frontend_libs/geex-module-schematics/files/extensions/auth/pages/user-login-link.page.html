<div class="auth-container">
  <div class="brand-header">
    <div class="logo-desktop">
      <img ngSrc="./assets/logo.png"
           width="64"
           height="64"
           alt="Geex Admin"
           class="brand-logo">
      <h1 class="brand-title">关联账号</h1>
      <div class="brand-subtitle">
        @if (displayName) {
        微信用户 {{ displayName }} 尚未关联本地账号
        } @else {
        外部登录尚未关联本地账号
        }
      </div>
    </div>
  </div>

  <div class="auth-card">
    <div class="card-content">
      <div class="tenant-info">
        <div class="tenant-display">
          <span class="tenant-label">租户:</span>
          <span class="tenant-code">{{ (geex.init() | async) && tenant$()?.code }}</span>
        </div>
        <button nz-button
                type="button"
                nzType="text"
                (click)="showTenantSwitcher()"
                class="tenant-switch">
          <i nz-icon
             nzType="swap"
             nzTheme="outline"></i>
          切换
        </button>
      </div>

      <nz-tabs (nzSelectChange)="switch($event)"
               nzCentered
               nzSize="large"
               class="tech-tabs">
        <nz-tab nzTitle="关联已有账号">
          <form nz-form
                [formGroup]="linkForm"
                (ngSubmit)="linkExisting()"
                class="auth-form">
            <div class="form-group">
              <label class="input-label">用户名</label>
              <nz-input-group nzPrefixIcon="user"
                              nzSize="large"
                              class="tech-input">
                <input nz-input
                       formControlName="userName"
                       placeholder="请输入用户名或邮箱"
                       autocomplete="username" />
              </nz-input-group>
            </div>
            <div class="form-group">
              <label class="input-label">密码</label>
              <nz-input-group nzPrefixIcon="lock"
                              nzSize="large"
                              class="tech-input">
                <input nz-input
                       type="password"
                       formControlName="password"
                       placeholder="请输入密码"
                       autocomplete="current-password" />
              </nz-input-group>
            </div>
            @if (error) {
            <div class="error-message">
              <i nz-icon
                 nzType="exclamation-circle"
                 nzTheme="outline"></i>
              {{ error }}
            </div>
            }
            <button nz-button
                    nzType="primary"
                    type="submit"
                    nzSize="large"
                    class="auth-button"
                    [nzLoading]="submitting()"
                    [disabled]="submitting()">
              <span class="button-content">
                <i nz-icon
                   nzType="link"
                   nzTheme="outline"></i>
                <span>登录并关联</span>
              </span>
            </button>
          </form>
        </nz-tab>

        <nz-tab nzTitle="注册新账号">
          <form nz-form
                [formGroup]="registerForm"
                (ngSubmit)="registerAndLink()"
                class="auth-form">
            <div class="form-group">
              <label class="input-label">用户名</label>
              <nz-input-group nzPrefixIcon="user"
                              nzSize="large"
                              class="tech-input">
                <input nz-input
                       formControlName="userName"
                       placeholder="请输入用户名"
                       autocomplete="username" />
              </nz-input-group>
            </div>
            <div class="form-group">
              <label class="input-label">密码</label>
              <nz-input-group nzPrefixIcon="lock"
                              nzSize="large"
                              class="tech-input">
                <input nz-input
                       type="password"
                       formControlName="password"
                       placeholder="至少 6 位"
                       autocomplete="new-password" />
              </nz-input-group>
            </div>
            <div class="form-group">
              <label class="input-label">邮箱(可选)</label>
              <nz-input-group nzPrefixIcon="mail"
                              nzSize="large"
                              class="tech-input">
                <input nz-input
                       formControlName="email"
                       placeholder="可选"
                       autocomplete="email" />
              </nz-input-group>
            </div>
            <div class="form-group">
              <label class="input-label">手机号(可选)</label>
              <nz-input-group nzPrefixIcon="mobile"
                              nzSize="large"
                              class="tech-input">
                <input nz-input
                       formControlName="phoneNumber"
                       placeholder="可选"
                       autocomplete="tel" />
              </nz-input-group>
            </div>
            @if (error) {
            <div class="error-message">
              <i nz-icon
                 nzType="exclamation-circle"
                 nzTheme="outline"></i>
              {{ error }}
            </div>
            }
            <button nz-button
                    nzType="primary"
                    type="submit"
                    nzSize="large"
                    class="auth-button"
                    [nzLoading]="submitting()"
                    [disabled]="submitting()">
              <span class="button-content">
                <i nz-icon
                   nzType="user-add"
                   nzTheme="outline"></i>
                <span>注册并关联</span>
              </span>
            </button>
          </form>
        </nz-tab>
      </nz-tabs>
    </div>
  </div>
</div>
