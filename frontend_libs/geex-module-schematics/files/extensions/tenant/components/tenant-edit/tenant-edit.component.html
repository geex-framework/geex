<label for="code">编码</label>
@if (isCreate) {

    [(ngModel)]="code"
    name="code"
    placeholder="">
}
<label for="name">名称</label>

  [(ngModel)]="name"
  name="name"
  placeholder="">

    nzType="primary"
    nzSize="small"
    (click)="submit()"
  nzSearch>确定</button>
