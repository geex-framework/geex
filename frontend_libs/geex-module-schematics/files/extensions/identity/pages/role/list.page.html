@defer (when params()) {
<list-page-layout [title]="I18N.Identity.role.listTitle"
                  [loading]="loading()"
                  [total]="total()"
                  [data]="data()"
                  [pi]="params().pi"
                  [ps]="params().ps"
                  [selectedCount]="selectedData().length"
                  [columns]="columns()"
                  (refresh)="refresh()"
                  (tableChange)="tableChange($event)">
  <form filters
        nz-form
        [formGroup]="paramsForm"
        nzLayout="inline">
    <nz-form-item>
      <nz-form-label>{{ I18N.Common.list.name }}</nz-form-label>
      <nz-form-control>
        <input nz-input
               [formControl]="paramsForm.controls.name" />
      </nz-form-control>
    </nz-form-item>
    <nz-form-item>
      <button (click)="refresh()"
              nz-button
              nzType="primary">
        <i nz-icon
           nzType="search"
           nzTheme="outline"></i>{{ I18N.Common.action.search }}
      </button>
    </nz-form-item>
  </form>
  <ng-template #headerExtra>
    <button (click)="add()"
            nz-button
            nzType="primary"
            [acl]="AppPermission.identity_mutation_createRole">
      <i nz-icon
         nzType="plus"></i>
      {{ I18N.Common.action.create }}
    </button>
  </ng-template>
  <ng-container toolbar>
    @if (can(AppPermission.identity_mutation_editRole)) {
      <nz-divider nzType="vertical" />
      <a (click)="batchDelete()"><i nz-icon
           nzType="delete"></i>
        {{ I18N.Common.action.delete }}
      </a>
    }
  </ng-container>
</list-page-layout>
}
