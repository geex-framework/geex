      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Publish to NuGet
        run: dotnet nuget push ./nupkg/*.nupkg --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --source https://api.nuget.org/v3/index.json --skip-duplicate

  build-and-publish-npm-package:
    needs: release-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        shell: pwsh
        working-directory: ./frontend_libs
    env:
      RELEASE_VERSION: ${{ needs.release-version.outputs.version }}
      NPM_DIST_TAG: ${{ needs.release-version.outputs.npm-tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-version.outputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend_libs/package.json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm
          cache-dependency-path: frontend_libs/pnpm-lock.yaml

      - name: Setup npm for trusted publishing
        run: |
          npm install --global npm@11
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install npm for trusted publishing.' }
          $npmVersion = npm --version
          if ($LASTEXITCODE -ne 0 -or [version]$npmVersion -lt [version]'11.5.1') {
            throw 'Trusted publishing requires npm 11.5.1 or later.'
          }
          Write-Host "Using npm $npmVersion for trusted publishing."

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Set all frontend versions from the release tag
        run: ./release.ps1 -Version $env:RELEASE_VERSION -Mode Prepare

      - name: Build all libraries in dependency order
        run: pnpm -r --workspace-concurrency=1 run build

      - name: Validate all release packages
        run: ./release.ps1 -Version $env:RELEASE_VERSION -Mode Verify

      - name: Validate Backups UI and regression tests
        shell: pwsh
        run: |
          pnpm --filter '@geexcode/geex-extensions-backups' run build:page
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter '@geexcode/geex-extensions-backups' test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pnpm --filter '@geexcode/geex-module-schematics' test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publish all frontend packages to npm with OIDC
        run: pnpm -r publish --access public --no-git-checks --ignore-scripts --tag $env:NPM_DIST_TAG
