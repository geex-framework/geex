name: publish
on:
  workflow_dispatch:
    inputs:
      tags:
        description: 'Existing release tag, e.g. v10.0.10 or refs/tags/v10.0.10-rc1'
        required: true
        type: string
  push:
    tags:
      - 'v*.*.*'

jobs:
  release-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.version.outputs.ref }}
      version: ${{ steps.version.outputs.version }}
      suffix: ${{ steps.version.outputs.suffix }}
      npm-tag: ${{ steps.version.outputs.npm-tag }}
    steps:
      - name: Resolve shared release version
        id: version
        shell: pwsh
        env:
          RELEASE_REF: ${{ github.event_name == 'workflow_dispatch' && inputs.tags || github.ref }}
        run: |
          $ref = $env:RELEASE_REF -creplace '^refs/tags/', ''
          $number = '(0|[1-9][0-9]*)'
          $identifier = '(?:0|[1-9][0-9]*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          if ($ref -cnotmatch "^v(?<version>$number\.$number\.$number(?:-(?<suffix>$identifier(?:\.$identifier)*))?)$") {
            throw "Invalid release tag '$ref'. Expected vMAJOR.MINOR.PATCH with an optional SemVer prerelease suffix."
          }
          $version = $Matches.version
          $suffix = $Matches.suffix
          $npmTag = if ($suffix) { 'next' } else { 'latest' }
          "ref=refs/tags/$ref" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "suffix=$suffix" >> $env:GITHUB_OUTPUT
          "npm-tag=$npmTag" >> $env:GITHUB_OUTPUT

  build-and-publish-nuget-package:
    needs: release-version
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      PACKAGE_DESCRIPTION: "Geex - A modern dev-friendly framework for building scalable and maintainable applications"
      PACKAGE_AUTHOR: "Geex Team"
      PACKAGE_COMPANY: "Geex"
      PACKAGE_COPYRIGHT: "Copyright © Geex Team"
      PACKAGE_LOGO_URL: "https://avatars.githubusercontent.com/u/136053225?s=64&v=4.png"
      PACKAGE_PROJECT_URL: "https://github.com/geex-framework/geex"
      PACKAGE_LICENSE_URL: "https://github.com/geex-framework/geex/blob/main/LICENSE"
      PACKAGE_REPOSITORY_URL: "https://github.com/geex-framework/geex"
      PACKAGE_TAGS: "geex framework dotnet mongodb graphql cqrs"
    steps:
      - name: Checkout code
        uses: actions/checkout@v2
        with:
          ref: ${{ needs.release-version.outputs.ref }}

      - name: Setup .NET Core SDK
        uses: actions/setup-dotnet@v1
        with:
          dotnet-version: 10.0.301
          
      - name: Restore dependencies
        run: dotnet restore ./framework_modules/framework_modules.sln
        
      - name: Build projects
        run: |
          dotnet build --configuration Release ./framework_modules/Geex.Analyzer/src/Geex.Analyzer.csproj
          dotnet build --configuration Release ./framework_modules/framework_modules.sln /p:IncludeSourceGeneratedFiles=true
      - name: Validate Backups without external services
        run: dotnet test ./framework_modules/Geex.Extensions.Backups/tests/Geex.Extensions.Backups.Tests.csproj --configuration Release --no-build --no-restore --filter 'FullyQualifiedName~BackupSchemaTests|FullyQualifiedName~BackupOptionsTests|FullyQualifiedName~MongodumpDiagnosticsTests|FullyQualifiedName~SubscriptionContextTests|FullyQualifiedName~DownloadResponseTests' --results-directory ./artifacts/backups/release --logger 'trx;LogFileName=results.trx'
      - name: Generate NuGet release packages
        if: ${{ needs.release-version.outputs.suffix == '' }}
        env:
          VERSION: ${{ needs.release-version.outputs.version }}
          SUFFIX: ${{ needs.release-version.outputs.suffix }}
        run: |
          dotnet pack ./framework_modules/Geex.Casbin/src/Geex.Casbin.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{env.VERSION}} /p:Description="${{env.PACKAGE_DESCRIPTION}}" /p:Authors="${{env.PACKAGE_AUTHOR}}" /p:Company="${{env.PACKAGE_COMPANY}}" /p:Copyright="${{env.PACKAGE_COPYRIGHT}}" /p:PackageIconUrl="${{env.PACKAGE_LOGO_URL}}" /p:PackageProjectUrl="${{env.PACKAGE_PROJECT_URL}}" /p:RepositoryUrl="${{env.PACKAGE_REPOSITORY_URL}}" /p:PackageTags="${{env.PACKAGE_TAGS}}"
          dotnet pack ./framework_modules/Geex.MongoDB.Entities/src/Geex.MongoDB.Entities.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{env.VERSION}} /p:Description="${{env.PACKAGE_DESCRIPTION}}" /p:Authors="${{env.PACKAGE_AUTHOR}}" /p:Company="${{env.PACKAGE_COMPANY}}" /p:Copyright="${{env.PACKAGE_COPYRIGHT}}" /p:PackageIconUrl="${{env.PACKAGE_LOGO_URL}}" /p:PackageProjectUrl="${{env.PACKAGE_PROJECT_URL}}" /p:RepositoryUrl="${{env.PACKAGE_REPOSITORY_URL}}" /p:PackageTags="${{env.PACKAGE_TAGS}}"
          dotnet pack ./framework_modules/Geex.Common/src/Geex.Common.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{env.VERSION}} /p:Description="${{env.PACKAGE_DESCRIPTION}}" /p:Authors="${{env.PACKAGE_AUTHOR}}" /p:Company="${{env.PACKAGE_COMPANY}}" /p:Copyright="${{env.PACKAGE_COPYRIGHT}}" /p:PackageIconUrl="${{env.PACKAGE_LOGO_URL}}" /p:PackageProjectUrl="${{env.PACKAGE_PROJECT_URL}}" /p:RepositoryUrl="${{env.PACKAGE_REPOSITORY_URL}}" /p:PackageTags="${{env.PACKAGE_TAGS}}"
          dotnet pack ./framework_modules/Geex.Abstractions/src/Geex.Abstractions.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{env.VERSION}} /p:Description="${{env.PACKAGE_DESCRIPTION}}" /p:Authors="${{env.PACKAGE_AUTHOR}}" /p:Company="${{env.PACKAGE_COMPANY}}" /p:Copyright="${{env.PACKAGE_COPYRIGHT}}" /p:PackageIconUrl="${{env.PACKAGE_LOGO_URL}}" /p:PackageProjectUrl="${{env.PACKAGE_PROJECT_URL}}" /p:RepositoryUrl="${{env.PACKAGE_REPOSITORY_URL}}" /p:PackageTags="${{env.PACKAGE_TAGS}}"
          dotnet pack ./framework_modules/Geex.Extensions.AuditLogs/src/Geex.Extensions.AuditLogs.csproj --configuration Release --no-build --output ./nupkg /p:PackageVersion=${{env.VERSION}} /p:Description="${{env.PACKAGE_DESCRIPTION}}" /p:Authors="${{env.PACKAGE_AUTHOR}}" /p:Company="${{env.PACKAGE_COMPANY}}" /p:Copyright="${{env.PACKAGE_COPYRIGHT}}" /p:PackageIconUrl="${{env.PACKAGE_LOGO_URL}}" /p:PackageProjectUrl="${{env.PACKAGE_PROJECT_URL}}" /p:RepositoryUrl="${{env.PACKAGE_REPOSITORY_URL}}" /p:PackageTags="${{env.PACKAGE_TAGS}}"
